[project]
name = "seekra"
version = "0.1.0"
description = "Seekra：使用 DeepSeek 和 Tavily 的终端搜索研究助手"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx[socks]>=0.28.1",
    "prompt-toolkit>=3.0.52,<4",
    "pyjwt[crypto]>=2.10,<3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
seekra = "seekra.cli:main"

[project.urls]
Repository = "https://github.com/kris45263/seekra"
Issues = "https://github.com/kris45263/seekra/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"
