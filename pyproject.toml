[project]
name = "seekra"
version = "0.1.0"
description = "Seekra：搜索网页、核对来源并支持会话追问的终端研究助手"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents==0.7.32",
    "filelock>=3.32.7",
    "httpx[socks]>=0.28.1",
    "langchain-litellm==0.11.2",
    "langchain-tavily==0.2.18",
    "langgraph-checkpoint-sqlite==3.1.3",
    "prompt-toolkit>=3.0.52,<4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
seekra = "seekra.terminal.cli:main"

[project.urls]
Repository = "https://github.com/kris45263/seekra"
Issues = "https://github.com/kris45263/seekra/issues"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.build-backend]
# uv 的构建包含规则独立于 Git 忽略规则；源码目录内的缓存也不分发。
source-exclude = [".uv-cache"]
